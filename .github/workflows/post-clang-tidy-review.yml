---
name: Post clang-tidy review comments

on:
  workflow_run:
    workflows: ["clang-tidy"]
    types:
      - completed

jobs:
  post:
    runs-on: ubuntu-latest
    # Only when a build succeeds
    # chatterino7-yt: PR review comments are SevenTV's; on the fork findings stay in the clang-tidy log
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.repository_owner == 'SevenTV' }}
    permissions:
      pull-requests: write

    steps:
      - uses: ZedThree/clang-tidy-review/post@438014136def4cb6242e9d0ef3da1a1cd48fa7ce # v0.23.1
        with:
          lgtm_comment_body: ""
          num_comments_as_exitcode: false
