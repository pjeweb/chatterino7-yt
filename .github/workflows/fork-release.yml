name: Fork release (draft)

# Turns the artifacts of one successful Build run into a draft release with
# SHA256SUMS, per-artifact SPDX SBOMs and GitHub artifact attestations.
# Manual only while heavy CI is paused. See docs/fork/RELEASES.md.
#
#   gh workflow run build.yml --ref vX.Y.Z
#   gh workflow run fork-release.yml --ref vX.Y.Z -f build-run-id=<Build run ID>

on:
  workflow_dispatch:
    inputs:
      build-run-id:
        description: "ID of a successful Build run dispatched on this tag"
        required: true
        type: string

permissions: {}

concurrency:
  group: fork-release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash # -eo pipefail

env:
  BUILD_RUN_ID: ${{ inputs.build-run-id }}
  TAG: ${{ github.ref_name }}

jobs:
  collect:
    name: Collect artifacts, checksums and SBOMs
    if: github.repository == 'pjeweb/chatterino7-yt' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04 # pinned: 7z, dpkg-deb and Python 3.12 come from this image
    permissions:
      actions: read # read the Build run and download its artifacts
      contents: read # check out the release scripts
    outputs:
      sboms: ${{ steps.select.outputs.sboms }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check Build run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$BUILD_RUN_ID" =~ ^[0-9]+$ ]] || { echo "build-run-id must be numeric"; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID" > "$RUNNER_TEMP/run.json"
          python3 scripts/fork/release-artifacts.py check-run "$RUNNER_TEMP/run.json" \
            --repo "$GITHUB_REPOSITORY" --sha "$GITHUB_SHA" --tag "$TAG"

      - name: Download Build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          run-id: ${{ env.BUILD_RUN_ID }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/build
          merge-multiple: true

      - name: Select release assets
        id: select
        run: |
          sboms=$(python3 scripts/fork/release-artifacts.py select "$RUNNER_TEMP/build" out/dist --tag "$TAG")
          echo "sboms=$sboms" >> "$GITHUB_OUTPUT"
          cat out/dist/SHA256SUMS

      - name: Install Syft
        id: syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.54.1

      - name: Generate artifact SBOMs
        env:
          SBOMS: ${{ steps.select.outputs.sboms }}
          SYFT: ${{ steps.syft.outputs.cmd }}
          SYFT_CHECK_FOR_APP_UPDATE: "false"
          SYFT_FILE_METADATA_SELECTION: all # list every packaged file
          SYFT_FILE_METADATA_DIGESTS: sha256
        run: |
          7z i | sed -n 1,3p
          mkdir out/sbom
          jq -r '.[] | [.name, .unpack] | @tsv' <<< "$SBOMS" | while IFS=$'\t' read -r name kind; do
            root="$RUNNER_TEMP/scan/$name"
            python3 scripts/fork/release-artifacts.py unpack "$kind" "out/dist/$name" "$root/contents"
            cp "out/dist/$name" "$root/" # lets Syft's .deb cataloger see package metadata
            "$SYFT" scan "dir:$root" --source-name "$name" --source-version "$TAG" \
              -o "spdx-json=out/sbom/$name.spdx.json" -o syft-table
          done

      - name: Upload release bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fork-release-bundle
          path: out/
          if-no-files-found: error
          retention-days: 7

  attest-provenance:
    name: Attest build provenance
    needs: collect
    runs-on: ubuntu-24.04
    permissions:
      id-token: write # Sigstore signing certificate
      attestations: write # store the attestation
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fork-release-bundle
          path: out
      - name: Verify checksums
        working-directory: out/dist
        run: sha256sum --check --strict SHA256SUMS && test "$(find . -mindepth 1 | wc -l)" -eq "$(($(wc -l < SHA256SUMS) + 1))"
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: out/dist/*

  attest-sbom:
    name: Attest SBOM (${{ matrix.artifact.name }})
    needs: collect
    runs-on: ubuntu-24.04
    permissions:
      id-token: write # Sigstore signing certificate
      attestations: write # store the attestation
    strategy:
      matrix:
        artifact: ${{ fromJSON(needs.collect.outputs.sboms) }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fork-release-bundle
          path: out
      - name: Verify checksums
        working-directory: out/dist
        run: sha256sum --check --strict SHA256SUMS
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: out/dist/${{ matrix.artifact.name }}
          sbom-path: out/sbom/${{ matrix.artifact.name }}.spdx.json

  draft-release:
    name: Create draft release
    needs: [collect, attest-provenance, attest-sbom]
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create the draft release and upload assets
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fork-release-bundle
          path: out
      - name: Verify checksums
        working-directory: out/dist
        run: sha256sum --check --strict SHA256SUMS && test "$(find . -mindepth 1 | wc -l)" -eq "$(($(wc -l < SHA256SUMS) + 1))"
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The tag must still name the commit that was built and attested.
          tag_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha)
          [ "$tag_sha" = "$GITHUB_SHA" ] || { echo "$TAG moved to $tag_sha"; exit 1; }
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "A release for $TAG already exists; not touching it"; exit 1
          fi
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          Draft built by [Build run $BUILD_RUN_ID]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID)
          from \`$GITHUB_SHA\`. Binaries are unsigned. Verify downloads as described in
          [docs/fork/RELEASES.md]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$TAG/docs/fork/RELEASES.md).
          EOF
          gh release create "$TAG" -R "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "chatterino7-yt $TAG" --notes-file "$RUNNER_TEMP/notes.md" \
            out/dist/* out/sbom/*
